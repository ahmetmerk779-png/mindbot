<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCraft Ultimate Kontrol Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f0f17; color: #cdd6f4; padding: 15px; margin: 0; }
        .card { background: #1e1e2e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #313244; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #terminal { background: #11111b; height: 260px; overflow-y: auto; padding: 10px; font-family: monospace; border-radius: 5px; }
        input { padding: 8px; background: #313244; border: 1px solid #45475a; color: white; border-radius: 4px; width: 90%; }
        button { padding: 10px 20px; background: #a6e3a1; color: #11111b; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-stop { background: #f38ba8; color: white; margin-left: 10px; }
    </style>
</head>
<body>
    <h2>⚡ MindCraft Ultimate AesirMC / Proxy Paneli</h2>
    <div class="card">
        <div class="grid">
            <div><label>Sunucu IP:</label><br><input type="text" id="cfgHost" value="oyna.aesirmc.com"></div>
            <div><label>Port:</label><br><input type="number" id="cfgPort" value="25565"></div>
            <div><label>Bot Adı:</label><br><input type="text" id="cfgUser" value="banyedin"></div>
            <div><label>Şifre (Oto-Login):</label><br><input type="password" id="cfgPass" placeholder="Şifreniz"></div>
            <div><label>Senin Oyundaki Adın (Master):</label><br><input type="text" id="cfgMaster" placeholder="Master Oyuncu Adın"></div>
            <div><label>Hedef Sunucu:</label><br><input type="text" id="cfgSub" value="Towny"></div>
        </div><br>
        <div><label>Groq API Key (Doğal Dil):</label><br><input type="password" id="cfgGroq" placeholder="gsk_..." style="width: 95%;"></div><br>
        <button onclick="startBot()">🚀 Botu Güvenli Başlat</button>
        <button onclick="stopBot()" class="btn-stop">🔴 Durdur</button>
    </div>
    <div class="card">
        <p>Durum: <b id="status">Kapalı</b> | Can: <b id="hp">20</b> | Konum: <b id="pos">X:0 Y:0 Z:0</b></p>
        <p>Eylem: <span id="action" style="color:#89b4fa">Pasif Beklemede</span></p>
    </div>
    <div class="card">
        <div id="terminal"></div>
    </div>
    <script>
        const socket = io();

        // SAYFA YÜKLENDİĞİNDE KAYITLI BİLGİLERİ OTOMATİK DOLDUR
        document.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('cfgHost')) document.getElementById('cfgHost').value = localStorage.getItem('cfgHost');
            if(localStorage.getItem('cfgPort')) document.getElementById('cfgPort').value = localStorage.getItem('cfgPort');
            if(localStorage.getItem('cfgUser')) document.getElementById('cfgUser').value = localStorage.getItem('cfgUser');
            if(localStorage.getItem('cfgPass')) document.getElementById('cfgPass').value = localStorage.getItem('cfgPass');
            if(localStorage.getItem('cfgMaster')) document.getElementById('cfgMaster').value = localStorage.getItem('cfgMaster');
            if(localStorage.getItem('cfgSub')) document.getElementById('cfgSub').value = localStorage.getItem('cfgSub');
            if(localStorage.getItem('cfgGroq')) document.getElementById('cfgGroq').value = localStorage.getItem('cfgGroq');
        });

        function startBot() {
            const config = {
                host: document.getElementById('cfgHost').value,
                port: document.getElementById('cfgPort').value,
                username: document.getElementById('cfgUser').value,
                password: document.getElementById('cfgPass').value,
                masterUser: document.getElementById('cfgMaster').value,
                subServer: document.getElementById('cfgSub').value,
                groqKey: document.getElementById('cfgGroq').value
            };

            // BİLGİLERİ TARAYICI HAFIZASINA (LOCALSTORAGE) KAYDET
            localStorage.setItem('cfgHost', config.host);
            localStorage.setItem('cfgPort', config.port);
            localStorage.setItem('cfgUser', config.username);
            localStorage.setItem('cfgPass', config.password);
            localStorage.setItem('cfgMaster', config.masterUser);
            localStorage.setItem('cfgSub', config.subServer);
            localStorage.setItem('cfgGroq', config.groqKey);

            socket.emit('start_bot_session', config);
        }

        function stopBot() { socket.emit('stop_bot_session'); }

        socket.on('bot_status', d => {
            document.getElementById('status').innerText = d.connected ? 'Oyunda ✅' : 'Kapalı ❌';
            document.getElementById('hp').innerText = d.health;
            document.getElementById('pos').innerText = d.location;
            document.getElementById('action').innerText = d.action;
        });

        socket.on('log_message', d => {
            const t = document.getElementById('terminal');
            t.innerHTML += `<div>[${d.time}] ${d.text}</div>`;
            t.scrollTop = t.scrollHeight;
        });
    </script>
</body>
</html>
